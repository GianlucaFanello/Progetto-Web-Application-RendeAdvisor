<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risultati</title>
  <link rel="stylesheet" href="risultati-r.css" type="text/css"/>
  <link href="https://fonts.googleapis.com/css2?family=Alkatra:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>


<main class="container">
  <h1>Risultati ricerca</h1>

  <section class="section">
    <h2>Hotel</h2>
    <div class="grid">
      <div class="card">
        <img src="../../assets/camera.jpg" alt="Hotel Centrale">
        <div class="card-body">
          <h3>Hotel Centrale</h3>
          <p>Via Roma 1</p>
          <div class="rating">
            <img class="star" src="../../assets/star2.png"/>
            <img class="star" src="../../assets/star2.png"/>
            <img class="star" src="../../assets/star2.png"/>
          </div>
        </div>
      </div>

      <div class="card">
        <img src="../../assets/camera.jpg" alt="B&B Rende">
        <div class="card-body">
          <h3>B&B Rende</h3>
          <p>Corso Umberto 12</p>
          <div class="rating">
            <img class="star" src="../../assets/star2.png"/>
            <img class="star" src="../../assets/star2.png"/>
          </div>
        </div>
      </div>

      <div class="card placeholder">
        <img src="../../assets/camera.jpg" alt="">
        <div class="card-body">
          <h3>Struttura 3</h3>
          <p>Indirizzo</p>
        </div>
      </div>

      <div class="card placeholder">
        <img src="../../assets/camera.jpg" alt="">
        <div class="card-body">
          <h3>Struttura 4</h3>
          <p>Indirizzo</p>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <h2>Ristoranti</h2>
    <div class="grid">
      <div class="card">
        <img src="../../assets/laGriglia.jpg" alt="La Griglia">
        <div class="card-body">
          <h3>La Griglia</h3>
          <p>Via Garibaldi 3</p>
          <div class="rating">
            <img class="star" src="../../assets/star2.png"/>
            <img class="star" src="../../assets/star2.png"/>
            <img class="star" src="../../assets/star2.png"/>
            <img class="star" src="../../assets/star2.png"/>
          </div>
        </div>
      </div>

      <div class="card">
        <img src="../../assets/MINDUJO.jpg" alt="Mindujo">
        <div class="card-body">
          <h3>Mindujo</h3>
          <p>Piazza Municipio</p>
        </div>
      </div>

      <div class="card placeholder">
        <img src="../../assets/la-sala-interna.jpg" alt="">
        <div class="card-body">
          <h3>Locale 3</h3>
          <p>Indirizzo</p>
        </div>
      </div>

      <div class="card placeholder">
        <img src="../../assets/willy-crak.jpg" alt="">
        <div class="card-body">
          <h3>Locale 4</h3>
          <p>Indirizzo</p>
        </div>
      </div>
    </div>
  </section>
</main>

</body>
</html>
