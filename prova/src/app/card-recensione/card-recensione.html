<div id="body" *ngIf="!loading">
  <div *ngFor="let r of recensioni" class="card-recensione">
    <div class="nRec">0</div>
    <div class="recensione">

      <div class="header">

        <div class="utente">
          <img class="logoUtente" src="../../assets/willy-crak.jpg" alt="logo">
          <span class="nome"></span>
        </div>

        <div class="info-row">
          <div class="rating-section">
            <span class="rating">{{r.valutazione}}</span>
            <img class="stelle" src="../../assets/star.png" alt="stelle">
          </div>

          <span class="rispondi">Rispondi</span>
        </div>

      </div>

      <div class="text-section">
        <span class="testo">{{r.testo}}</span>
      </div>

    </div>
  </div>
</div>
