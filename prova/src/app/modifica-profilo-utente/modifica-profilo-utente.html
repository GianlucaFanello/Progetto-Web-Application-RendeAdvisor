<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modifica profilo utente</title>
<link rel="stylesheet" href="modifica-profilo-utente.css" type="text/css"/>
</head>
<body>
    <div id="principale">
        <div id="principale2">
          <h1>Modifica profilo</h1>
        </div>
        <div id="principale3">
            <div id="formContainer">
                <div class="divbox nome"><label>Nome:</label></div>
                <textarea class="textArea" placeholder="Inserisci nome"></textarea>

                <div class="divbox cognome"><label>Cognome:</label></div>
                <textarea class="textArea" placeholder="Inserisci cognome"></textarea>

                <div class="divbox username"><label>Username:</label></div>
                <textarea class="textArea" placeholder="Inserisci username"></textarea>

                <div class="divbox descrizione"><label>Descrizione:</label></div>
                <textarea id="descrizione" class="textArea" placeholder="Inserisci descrizione"></textarea>
            </div>
            <div id="fotoButtonContainer">
              <img id="fotoProfilo" src="../../assets/paolo rossi.jpg">
              <button id="sfoglia">Sfoglia</button>
            </div>
              <button id="salvaModifiche">Salva modifiche</button>
            </div>
        </div>

</body>
</html>
