<div id="body">
<div id = "main-container">
  <div class="Flexbox1">
    <div><h1>Benvenuto</h1></div>

    <div><p><label>Nome:</label></p>
    <input [(ngModel)]="utente.nome" type="text"  id="nome"></div>

    <div><p><label>Cognome:</label></p>
    <input [(ngModel)]="utente.cognome" type="text"  id="cognome"></div>

    <div><p><label>Username:</label></p>
      <input [(ngModel)]="utente.username" type="text"  id="username"></div>

    <div><p><label>Email:</label></p>
      <input [(ngModel)]="utente.email" type="email"  id="email"></div>

    <div><p><label>Password:</label></p>
      <input [(ngModel)]="utente.password" type="password" id="password"></div>

    <div class="messaggio-container">
      <span id="messaggio">{{ messaggio }}</span>
    </div>

    <div>
      <button type="button" id="tastoRegistra" [disabled]="loading" (click)="registra()">Registrati</button>
      <span *ngIf="loading" class="spinner"></span>
    </div>
  </div>
</div>
</div>
