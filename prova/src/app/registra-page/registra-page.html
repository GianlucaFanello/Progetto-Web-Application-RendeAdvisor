<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Registrati</title>
  <link rel="stylesheet" href="registra-page.css" type="text/css"/>
</head>
<body>
<form method="POST">
  <div class="Flexbox2">
    <div><h1>Benvenuto</h1></div>
  </div>

  <div class="Flexbox3">
    <div><p><label>Nome:</label></p>
    <input type="text"  id="nome"></div>
  </div>

  <div class="Flexbox4">
    <div><p><label>Cognome:</label></p>
    <input type="text"  id="cognome"></div>
  </div>

  <div class="Flexbox5">
    <div><p><label>Username:</label></p>
      <input type="text"  id="username"></div>
  </div>

  <div class="Flexbox6">
    <div><p><label>Email:</label></p>
      <input type="email"  id="email"></div>
  </div>

  <div class="Flexbox7">
    <div><p><label>Password:</label></p>
      <input type="password" id="password"></div>
  </div>

  <div class="Flexbox7">
    <div><input type="button" value="REGISTRATI" id="tastoRegistra"></div>
  </div>
</form>
