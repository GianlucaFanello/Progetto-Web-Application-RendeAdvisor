<div id="body">
  <div class="Flexbox2">
    <div><h1>HOTEL</h1></div>
  </div>

  <div class="search-container">
    <div><input type="search" placeholder="Cerca Hotel"  [(ngModel)]="searchText" id="searchBar" (keyup.enter)="search()" /></div>
    <div><input type="button" value="Ricerca" id="ricercaButton" (click)="search()" /></div>
    <div id="searchDropdown" class="search-dropdown"></div>
  </div>

  <div class="Flexbox3">
    <div><h2>TROVA IL POSTO  GIUSTO  ACCANTO  A  TE  A  RENDE!</h2></div>
  </div>

  <div class="Flexbox4">
    <div *ngFor="let h of listaHotel">
      <img [src]="'data:image/jpeg;base64,' + h.immagine"
           [alt]="h.nomeLocale"
           class="hotel-img" />
      <p>{{ h.nomeLocale }}</p>
    </div>
  </div>
</div>
