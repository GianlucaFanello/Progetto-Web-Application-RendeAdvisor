<!DOCTYPE html>
<html>
<head>
<title>Modifica profilo struttura</title>
<link rel="stylesheet" href="ModificaProfiloUtente.css" type="text/css"/>
<link href="https://fonts.googleapis.com/css2?family=Alkatra:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Modifica profilo utente <img src="../../png/gears.png" width="30px"></h1>
    <div id="principale">
        <div id="secondario">
            <div class="interno nome">
                <label class="etichette">Nome</label>
                <textarea class="textArea" placeholder="Inserisci nome"></textarea>
            </div>
            <div class="interno cognome">
                <label class="etichette">Cognome</label>
                <textarea class="textArea" placeholder="Inserisci cognome"></textarea>
            </div>
            <div class="interno Email">
                <label class="etichette">Email</label>
                <textarea class="textArea" placeholder="Inserisci email"></textarea>
            </div>
            <div class="interno Username">
                <label class="etichette">Username</label>
                <textarea class="textArea" placeholder="Inserisci username"></textarea>
            </div>
            <div class="interno descrizione">
                <label class="etichette">Descrizione</label>
                <textarea class="textArea boxDescrizione" placeholder="Inserisci descrizione"></textarea>
            </div>
        </div>
        <div id="terzario">
        <img src="../../foto/paolo rossi.jpg" id="fotoProfilo">
        <button class="sfoglia annulla">Sfoglia</button>
        </div>
        <button class="button" id="buttonModifiche">Salva modifiche</button>
        <button class="annulla">Annulla</button>
    </div>
</body>
</html>
