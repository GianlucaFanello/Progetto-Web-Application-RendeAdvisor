<!DOCTYPE html>
<html>
<head>
<title>Profilo struttura</title>
<link rel="stylesheet" href="profiloStruttura.css" type="text/css"/>
<link href="https://fonts.googleapis.com/css2?family=Alkatra:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="principale">
        <div id="principale2">
            <img id="fotoUtente" src="../../foto/camera.jpg">
            <label id="nome">Nome della struttura</label>
            <h2>Voto <img src="../../png/star.png" width="30px" alt=""></h2>
            <div class="sottoDiv">
                <h2 id="stringaEmail">EmailStruttura@dominio.com <img class="img" src="../../png/email.png" width="30px"></h2>
                <h2>Indirizzo struttura <img class="img" src="../../png/palazzi.png"  width="30px"></h2>
            </div>
            <div class="sottoDiv">
                <h2>numero di telefono <img src="../../png/phone.png" width="30px"></h2>
                <h2>proprietario <img src="../../png/hat.png" width="30px"></h2>
            </div>
            
            <textarea id="textArea">Descrizione</textarea>
            <div id="secondario">
                <button class="button">Recensioni <img src="../../png/scrittura.png" width="20px"></button>
                <div id="terzario">
                    <label id="nelCuoreNumero">Nel cuore di</label>
                    <label id="contatore">N</label>
                    <label > persone <img src="../../png/Cuore pieno.png" width="30px"></label>
                </div>
            </div>
            <div>Clicca per inserire nel cuore <img src="../../png/Heart empty.png" width="50px"></div>
</body>
</html>
