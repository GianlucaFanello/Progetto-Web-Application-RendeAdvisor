<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrazione</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
</head>
<style>
    .secondo {
        width:100%;
        overflow:auto;
    }
    .secondo div {
        width:35%;
        float:left;
    }
</style>
<body>
<main>
    <div class="secondo">
       <div>
        <header><h1>Benvenuto, Registrati!</h1></header>
       </div>
       <div>
           <p><a href="Portfolio.html">Home</a></p>
       </div>
    </div>
    <section>
        <fieldset>
            <form>
                <p>
                <label>Nome:</label>
                <input type="text" name="nome" placeholder="Inserisci il tuo nome"/>
                </p>
                <p>
                <label>
                    Cognome:
                </label>
                <input type="text" name="cognome" placeholder="Inserisci il tuo cognome"/>
                </p>
                <p>
                <label>Email:</label>
                <input type="email" name="email" placeholder="Inserisci la tua email"/>
                </p>
                <p>
                <label>Password:</label>
                <input type="password" name="password" placeholder="Inserisci la tua password"/>
                </p>
                <input type="submit" value="Registra"/>
            </form>
        </fieldset>
    </section>
    <section>
        <h1>Perche'?</h1>
        <h3>Una volta registrato potrai caricare i tuoi dati universitari!</h3>
    </section>

    <div class="secondo">
       <div>
            <footer>
                <p>Marco Brogi - Copyright</p>
            </footer>
       </div>
    </div>
</main>
</body>
</html>
